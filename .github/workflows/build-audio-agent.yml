name: Build IntelliHire Audio Agent

on:
  workflow_dispatch:

jobs:
  build-audio-agent:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PyAudioWPatch==0.2.12.8
          pip install fastapi uvicorn websocket-client python-dotenv

      - name: Verify Python imports
        run: |
          python -c "import pyaudiowpatch; print('PyAudioWPatch OK')"
          python -c "import fastapi; print('FastAPI OK')"
          python -c "import uvicorn; print('Uvicorn OK')"
          python -c "import websocket; print('WebSocket OK')"

      - name: Build executable
        run: |
          pyinstaller --onefile --name IntelliHireAudio local_audio_server.py

      - name: Verify executable exists
        shell: powershell
        run: |
          if (-not (Test-Path "dist\IntelliHireAudio.exe")) {
            Write-Error "IntelliHireAudio.exe was not created"
            exit 1
          }

          Write-Host "IntelliHireAudio.exe created successfully"
          Get-Item "dist\IntelliHireAudio.exe"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: IntelliHireAudio
          path: dist/IntelliHireAudio.exe
