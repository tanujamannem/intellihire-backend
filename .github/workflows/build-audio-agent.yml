name: Build IntelliHire Audio Agent

on:
  workflow_dispatch:

jobs:
  build-audio-agent:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PyAudioWPatch==0.2.12.8
          pip install fastapi uvicorn websocket-client python-dotenv

      - name: Verify imports
        run: |
          python -c "import pyaudiowpatch; print('PyAudioWPatch OK')"
          python -c "import fastapi; print('FastAPI OK')"
          python -c "import uvicorn; print('Uvicorn OK')"
          python -c "import websocket; print('WebSocket OK')"

      - name: Build executable
        run: |
          pyinstaller --onefile --name IntelliHireAudio local_audio_server.py

      - name: Create package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path package
          Copy-Item "dist\IntelliHireAudio.exe" "package\IntelliHireAudio.exe"
          Copy-Item "start_intellihire_audio.bat" "package\start_intellihire_audio.bat"

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive -Path "package\*" -DestinationPath "IntelliHireAudio-Windows.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: IntelliHireAudio-Windows
          path: IntelliHireAudio-Windows.zip
